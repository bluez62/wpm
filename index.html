<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple WPM Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="test-container">
        <h1>Typing Speed Test</h1>
        <p id="quote-display">The quick brown fox jumps over the lazy dog.</p>
        <textarea id="quote-input" placeholder="Start typing here to begin the test..." autofocus></textarea>
        <div class="stats">
            <div>Time: <span id="timer">0</span>s</div>
            <div>WPM: <span id="wpm">0</span></div>
        </div>
        <button id="reset-btn">Restart</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
