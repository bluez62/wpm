<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple WPM Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="test-container">
        <h1>Typing Speed Test</h1>
        
        <div class="input-container">
            <div id="quote-display"></div>
            <textarea id="quote-input" autofocus></textarea>
        </div>

        <div class="stats">
            <div>Time: <span id="timer">0</span>s</div>
            <div>WPM: <span id="wpm">0</span></div>
            <div>Best: <span id="best-wpm">0</span></div>
            <div>Faster Than: <span id="percentile">0.0</span>%</div>
            <div>Est. Rank: #<span id="world-rank">50,000,000</span></div>
        </div>
        <button id="reset-btn">Restart</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
